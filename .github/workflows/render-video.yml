# Render short-form video using Remotion CLI on GitHub-hosted runners (free minutes).
# Configure repo secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_ACCOUNT_ID, R2_PUBLIC_URL (optional).
# This workflow is a scaffold — wire downloads/uploads to match your `remotion/` entry.

name: Render video

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # TODO: download assets for job id in client_payload, run `npx remotion render`, upload MP4 to R2, POST webhookUrl
      - name: Placeholder
        run: |
          echo "jobId=${{ github.event.client_payload.jobId }}"
          echo "composition=${{ github.event.client_payload.composition }}"
